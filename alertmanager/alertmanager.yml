global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - alertname="NodeDown"
    target_matchers:
      - severity=~"warning|critical"
    equal: [instance]

receivers:
  - name: default
    # Configure at least one notification channel. Examples:
    #
    # webhook_configs:
    #   - url: "https://example.com/hooks/alerts"
    #     send_resolved: true
