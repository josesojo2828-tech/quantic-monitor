global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "local"  # override per host if you run multiple stacks

  - job_name: auth
    static_configs:
      - targets: ["auth-exporter:9101"]
        labels:
          host: "local"  # override per host if you run multiple stacks
